vich_uploader:
    db_driver: orm

    mappings:
        section_documents:
            uri_prefix: /uploads/section-documents
            upload_destination: '%kernel.project_dir%/public/uploads/section-documents'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        map_place_photos:
            uri_prefix: /uploads/map-places
            upload_destination: '%kernel.project_dir%/public/uploads/map-places'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        room_category_photos:
            uri_prefix: /uploads/room-categories
            upload_destination: '%kernel.project_dir%/public/uploads/room-categories'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        section_media:
            uri_prefix: /uploads/section-media
            upload_destination: '%kernel.project_dir%/public/uploads/section-media'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        content_files:
            uri_prefix: /uploads/content-files
            upload_destination: '%kernel.project_dir%/public/uploads/content-files'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
